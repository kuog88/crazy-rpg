  let r = Math.random() * w.reduce((a, b) => a + b);

  const rm = 1 + rarity * 0.15;
  const it = { id: uid(), slot, rarity, ilvl, plus: 0, spent: 0, affixes: [], cls, v: randi(0, 1) }; // v: which of the 2 art variants for this rarity
  if (slot === 'weapon') { it.wtype = wtype || WTYPES[cls][randi(0, 2)].id; it.base = Math.round((8 + ilvl * 2) * rm); }
  else if (slot === 'helm') it.base = Math.round((4 + ilvl) * rm);
  else if (slot === 'chest') it.base = Math.round((7 + ilvl * 1.5) * rm);
  else it.base = Math.round((30 + ilvl * 8) * rm);

function ensureQuestState(ch) {

// no repeats: errands are drawn from a shuffled deck of every type; the deck is reshuffled when it runs out
function nextQuestDef(ch) {
  if (!ch.questDeck || !ch.questDeck.length) {
    const ids = QUESTS.map(d => d.id).sort(() => Math.random() - 0.5);
    if (ids[0] === ch.lastQuest && ids.length > 1) ids.push(ids.shift()); // no back-to-back repeat across reshuffles

  }
  const id = ch.questDeck.shift(); ch.lastQuest = id;

  const def = nextQuestDef(ch), need = randi(def.need[0], def.need[1]);

  ch.questOffer = { id: def.id, need, ask: def.asks[randi(0, def.asks.length - 1)].replace(/\{n\}/g, need), reward: R.k, says: R.says[randi(0, R.says.length - 1)] };
}

// (an accepted errand stays until it is turned in; the next one only appears after turning it in)
function refreshQuests(ch) {
  ensureQuestState(ch);
  if (!ch.quest && !ch.questOffer) rollQuestOffer(ch);
}
function grantQuestReward(cls, ch, k, ilvl) {
  const sh = Save.shared;
  if (k === 'blue' || k === 'green') { const it = makeItem(cls, ilvl, 0, undefined, undefined, k === 'blue' ? 2 : 1); ch.bag.push(it); return `得到 ${itemName(it)}`; }
  if (k === 'potion') { ch.pots.red[0] += 1; return '得到 小紅藥水 ×1'; }
  if (k === 'gold') { const g = randi(50, 150); sh.gold += g; return `得到 ${g} 金幣`; }

}
function questInfo(ch) {
  if (!ch.quest || !ch.quest.id) return null;
  const def = QUESTS.find(d => d.id === ch.quest.id), t = ch.tally || {};
  if (!def) return null;

  POOL: ['potion', 'smith', 'tailor', 'store', 'trainer', 'pets', 'gate'], EVERY: 300,
  st() { const s = Save.shared; if (!s.npcEv) s.npcEv = { t: 0, list: [], seeded: false }; return s.npcEv; },
  // play-time clock (town and field); every 5 minutes a new "!" if fewer than two are up
  tick(dt) {

    let left = NPC_EV[npc].map((_, i) => i).filter(i => !used.includes(i)); if (!left.length) { used.length = 0; left = NPC_EV[npc].map((_, i) => i); }

function questProgress(ch) {

function npcReward(ch, big) {
  const m = (1 + 0.5 * (ch.best || 0)) * (big ? 1.6 : 1), r = Math.random(), sh = Save.shared;
  if (r < 0.35) { const g = Math.round(rand(150, 320) * m / 10) * 10; sh.gold += g; return `金幣 +${g}`; }
  if (r < 0.55) { const n = big ? 3 : randi(1, 2); ch.crystals = (ch.crystals || 0) + n; return `礦物晶石 +${n}`; }
  if (r < 0.75) { const n = Math.round(randi(2, 4) * (big ? 1.5 : 1)); sh.shards = (sh.shards || 0) + n; return `能量碎片 +${n}`; }
  if (r < 0.88) { ch.pots.red[0] = (ch.pots.red[0] || 0) + (big ? 2 : 1); return `紅藥水 +${big ? 2 : 1}`; }

function npcPenalty(ch) {

  if (r < 0.65) { const k = Object.keys(CURSES)[randi(0, 2)]; ch.curse = k; return '詛咒：下一關' + CURSES[k]; }
  if (r < 0.85 || !(ch.crystals > 0)) { const g = Math.min(sh.gold, Math.round(rand(80, 240) * (1 + 0.4 * (ch.best || 0)) / 10) * 10); sh.gold -= g; return g > 0 ? `被偷走金幣 ${g}` : '他想偷你的錢，結果發現你比他還窮。'; }
  ch.crystals--; return '被偷走礦物晶石 1 顆';
}
/* the event window: NPC picture, their line, two answers; then their reaction and what you got or lost */
function npcEventPanel(scene, n) {
  const ch = Save.ch(scene.clsKey), ev = NpcEv.at(n.menu), img = `art/${n.key}.webp`;
  const q = ch.npcQuest && ch.npcQuest.npc === n.menu ? ch.npcQuest : null;
  let stage = 'ask', reply = '', gain = '', good = true; const flip = Math.random() < 0.5;
  const face = () => h('img', { src: img, alt: '', style: 'float:left;height:150px;margin:0 14px 6px 0;filter:drop-shadow(0 4px 6px #000)' });
  const finish = (text, got, ok) => { reply = text; gain = got; good = ok; stage = 'result'; Save.write(); Panel.refresh(); };
  Panel.show(n.name, body => {
    const box = h('div', { class: 'say', style: 'overflow:hidden;min-height:150px' }, face());
    body.append(box);
    if (stage === 'result') {
      box.append(h('div', { style: 'font-size:17px;line-height:1.7' }, reply), h('div', { style: `margin-top:10px;font-weight:900;color:${good ? '#9fe8a0' : '#ff9a8a'}` }, gain));
      body.append(h('button', { type: 'button', class: 'big', on: { click: () => Panel.close() } }, good ? '謝啦！' : '……我記住你了'));
      return;
    }
    if (q) { // returning with an errand in hand
      const prog = questProgress(ch), def = NPC_QUEST[n.menu];
      if (prog >= q.need) {
        box.append(h('div', { style: 'font-size:17px;line-height:1.7' }, def.done));
        body.append(h('button', { type: 'button', class: 'big', on: { click: () => { ch.npcQuest = null; finish(def.done, npcReward(ch, true), true); } } }, '領取報酬'));
      } else {
        box.append(h('div', { style: 'font-size:17px;line-height:1.7' }, `還沒好嗎？${QUEST_KIND[q.kind]}：${Math.max(0, prog)} / ${q.need}。快去啦！`));
        body.append(h('button', { type: 'button', class: 'big', on: { click: () => Panel.close() } }, '知道了'),
          h('button', { type: 'button', on: { click: () => { ch.npcQuest = null; finish('放棄了？哈哈哈！我就知道你辦不到！', npcPenalty(ch), false); } } }, '放棄委託'));
      }
      return;
    }
    if (ev.quest && !ch.npcQuest) {
      const def = NPC_QUEST[n.menu];
      box.append(h('div', { style: 'font-size:17px;line-height:1.7' }, def.q), h('div', { class: 'muted', style: 'margin-top:8px' }, `委託：${QUEST_KIND[def.kind]} ${def.need}（完成後回來找我，報酬加倍）`));
      body.append(h('button', { type: 'button', class: 'big', on: { click: () => {
        ensureQuestState(ch); ch.npcQuest = { npc: n.menu, kind: def.kind, need: def.need, base: ch.tally[def.kind] || 0, got: 0 }; NpcEv.done(n.menu);
        finish('好！說定了！你要是敢跑掉，我就去你夢裡找你！', `接下委託：${QUEST_KIND[def.kind]} ${def.need}`, true);
      } } }, 'A　好，交給我'),
        h('button', { type: 'button', on: { click: () => { NpcEv.done(n.menu); finish('不要？好啦，反正我也只是隨便問問。……（他偷偷在你背後貼了一張紙）', '（背後被貼了「我很遜」）', false); } } }, 'B　不要'));
      return;
    }
    const E = NPC_EV[n.menu][ev.i];
    box.append(h('div', { style: 'font-size:17px;line-height:1.7' }, E.q));
    const pick = side => {
      NpcEv.done(n.menu);
      const right = E.ok === 'rand' ? Math.random() < 0.5 : E.ok === side;
      if (right) { SFX.perfect(); finish(E.win, npcReward(ch, false), true); }
      else { SFX.hit(true); finish(E.lose, npcPenalty(ch), false); }
    };
    const opts = flip ? [['b', E.b], ['a', E.a]] : [['a', E.a], ['b', E.b]];
    body.append(...opts.map((o, k) => h('button', { type: 'button', class: 'big', 'data-hot': 'Digit' + (k + 1), on: { click: () => pick(o[0]) } }, (k ? 'B　' : 'A　') + o[1], h('span', { class: 'khint' }, `［${k + 1}］`))));
  });
}

/* ================= NEW-PLAYER GUIDE =================
   The skill trainer (who knows he is an NPC) talks to "the god" through a small box at the top of the screen.
   It never pauses the game: each tip waits for the player to actually do the thing (or times out for info tips),
   and every tip is shown once per save. "跳過教學" turns the whole guide off. */
const IS_TOUCH = window.matchMedia('(pointer:coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints > 0);
const KEYN = IS_TOUCH ? { move: '左半邊螢幕拖曳', A: '「攻擊」鈕', jump: '「跳」鈕', S: '右邊的防禦鈕', skills: '技能鈕', red: '紅藥鈕', blue: '藍藥鈕', talk: '「對話」鈕' }
  : { move: '方向鍵', A: 'A 鍵', jump: '空白鍵', S: 'S 鍵', skills: 'Q W E R', red: '1', blue: '2', talk: 'A 鍵' };
const Tut = {
  cur: null, q: [], t: 0, marks: {}, el: null,
  st() { const s = Save.shared; if (!s.tut) s.tut = {}; return s.tut; },
  off() { return !!this.st().skip; },
  mark(k) { this.marks[k] = (this.marks[k] || 0) + 1; },
  // queue a tip: done() -> true when the player did it; dur -> info tip that closes by itself; target -> NPC to point at
  say(id, text, o) {
    o = o || {};
    if (this.off() || this.st()[id] || (this.cur && this.cur.id === id) || this.q.some(x => x.id === id)) return;
    const step = Object.assign({ id, text }, o);
    if (o.urgent && this.cur && !this.cur.urgent) { this.q.unshift(this.cur); this.cur = null; } // urgent tips cut in; the interrupted one comes back right after
    if (!this.cur) this.open(step); else if (o.urgent) this.q.unshift(step); else this.q.push(step);
  },
  open(step) {
    this.cur = step; this.t = 0; if (step.reset) for (const k of step.reset) this.marks[k] = 0;
    const el = this.el = this.el || document.getElementById('tutTip');
    document.getElementById('tutTipText').textContent = step.text; el.hidden = false;
    document.getElementById('tutTipWho').textContent = step.who === 'guard' ? '守衛' : '導師'; this.place();
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); SFX.tick();

    if (!this.cur && this.el) this.el.hidden = true;

  place() {

    const r = cv.getBoundingClientRect(), k = r.width / W, c = this.cur, town = G.town && G.town.sys && G.town.sys.isActive() ? G.town : null;
    const npc = c && c.target && town ? town.npcs.find(o => o.menu === c.target) : null;

  showResults() {
    const gm = G.game, s = gm.stats, t = Math.round(gm.simTime);
    const lines = [`通關時間 ${Math.floor(t / 60)} 分 ${t % 60} 秒　擊倒 ${s.kills} 隻　最高連擊 ${s.bestCombo || 0}`, `經驗 +${s.exp}${s.levels ? `（升了 ${s.levels} 級）` : ''}　裝備 ${s.items} 件`, `金幣 +${s.gold}　礦物晶石 +${s.crystal}　能量碎片 +${s.shard}`, `復活藥用了 ${s.revivesUsed} 次`];
    this.showModal(`第 ${gm.stageId} 關　通關`, lines, [{ label: '回主城', cb: () => this.toTown(gm.stage.clearMsg) }, { label: '再打一次', cb: () => this.restart() }]);
  }
  restart() { const k = G.game.clsKey, s = G.game.stageId; Save.write(); this.scene.stop('UI'); G.game.scene.restart({ cls: k, stage: s }); }
  toTown(msg) { const k = G.game.clsKey; Save.write(); this.scene.stop('UI'); G.game.scene.start('Town', { cls: k, msg }); }
  toSelect() { Save.write(); this.scene.stop('UI'); G.game.scene.start('Select'); }
  update() {
    const gm = G.game; if (!gm || !gm.player || !gm.sys.isActive()) return;
    while (G.msgQ.length) this.handleMsg(G.msgQ.shift());
    const p = gm.player, c = gm.cls, g = this.g, g2 = this.g2; g.clear(); g2.clear();
    g.fillStyle(0x0b0d0a, 0.72); g.fillRoundedRect(10, 10, 326, 100, 8); g.lineStyle(1, 0xc9a45c, 0.5); g.strokeRoundedRect(10, 10, 326, 100, 8);
    g.fillStyle(0x2a0f0c, 1); g.fillRect(96, 22, 220, 14); g.fillStyle(0xc8352a, 1); g.fillRect(96, 22, 220 * p.hp / p.maxHp, 14);
    if (p.shieldHp > 0) { g.fillStyle(0xfff1a0, 0.7); g.fillRect(96, 22, Math.min(220, 220 * p.shieldHp / p.maxHp), 4); }
    g.fillStyle(0x0c1430, 1); g.fillRect(96, 40, 220, 10); g.fillStyle(0x2f63c8, 1); g.fillRect(96, 40, 220 * p.mp / p.maxMp, 10);
    this.hpT.setText(Math.ceil(p.hp) + ' / ' + p.maxHp); this.mpT.setText(Math.floor(p.mp) + ' / ' + p.maxMp);
    this.nameT.setText(`${c.name} Lv ${gm.ch.lvl}`);
    g.fillStyle(0x221a10, 1); g.fillRect(22, 98, 304, 4); g.fillStyle(0xe9c46a, 1); g.fillRect(22, 98, 304 * (gm.ch.lvl >= MAX_LV ? 1 : gm.ch.exp / expNext(gm.ch.lvl)), 4);
    this.resT.setText(`金幣 ${Save.shared.gold}　晶石 ${gm.ch.crystals}　碎片 ${Save.shared.shards}　背包 ${gm.ch.bag.length}/${BAG_MAX}`);
    this.bagT.setText(`復活藥 ${gm.ch.revive}　本關已用 ${gm.stats.revivesUsed} / 2`);
    const bl = Object.keys(p.buffs).map(k => BUFFS[k].name + ' ' + Math.ceil(p.buffs[k]) + 's');
    if (p.nextCrit) bl.unshift('下一擊必定暴擊');
    if (p.nextDouble) bl.unshift('完美格擋：下一擊 2 倍');
    [['wallT', '盾牆'], ['drT', '怒吼減傷'], ['bloodT', '嗜血'], ['frenzyT', '狂暴'], ['shieldT', '護盾']].forEach(([k, n]) => { if (p[k] > 0 && (k !== 'shieldT' || p.shieldHp > 0)) bl.push(n + ' ' + Math.ceil(p[k]) + 's'); });
    if (gm.clsKey === 'berserker' && p.hp < p.maxHp) bl.push('血怒 攻擊 +' + Math.round(clamp((1 - p.hp / p.maxHp) / 0.9, 0, 1) * 100) + '%');
    if (gm.clsKey === 'paladin') bl.push(gm.martyrUsed ? '殉道 已用' : '殉道 待命');
    if (gm.run) {
      for (const k in gm.run.boons) bl.push(BOONS[k].n + ' ' + ROMAN[gm.run.boons[k]]);
      gm.run.runes.forEach((r, i) => { if (r) bl.push('QWER'[i] + ' ' + RUNES[r.k].n + ' ' + ROMAN[r.t]); });
    }
    this.buffT.setText(bl.join('\n'));
    this.waveT.setText(gm.trial ? '新手試煉・城門外的訓練場' : gm.inPortal ? `傳送門・${gm.stage.portal.name}` : `第 ${gm.stageId} 關 ${gm.stage.name}　·　第 ${Math.min(gm.waveIdx + 1, WAVES.length)} / ${WAVES.length} 波`);
    const b = gm.inPortal ? gm.miniBoss : gm.boss;
    if (b && !b.dead) {
      this.bossT.setText((b.big ? ENEMY[b.sheet].name : gm.stage.bossName) + (b.phase2 ? '（狂暴）' : ''));
      g.fillStyle(0x000000, 0.7); g.fillRect(278, 60, 404, 14); g.fillStyle(b.phase2 ? 0xff4a20 : 0xd9832a, 1); g.fillRect(280, 62, 400 * Math.max(0, b.hp / b.maxHp), 10);
    } else this.bossT.setText('');
    this.goT.setAlpha(gm.showGo ? 0.5 + Math.sin(gm.simTime * 6) * 0.5 : 0);
    for (const bt of this.btns) {
      let ready = true, frac = 0, cdText = '', count = '';
      if (bt.potion) {
        const cd = p.potCd[bt.id], have = gm.potCount(bt.id); frac = cd / 15; ready = cd <= 0 && have > 0; cdText = cd > 0 ? Math.ceil(cd) + '' : ''; count = (this.touch ? (cd > 0 ? '' : '×' + have) : have + ' ・' + bt.key);
        g.fillStyle(bt.col, ready ? (this.touch ? 0.4 : 0.9) : (this.touch ? 0.18 : 0.28)); g.fillCircle(bt.x, bt.y, bt.r);
        if (this.touch) { g.lineStyle(3, ready ? 0xffffff : 0x888888, ready ? 0.55 : 0.25); g.strokeCircle(bt.x, bt.y, bt.r); }
      } else {
        if (bt.id[0] === 's') { const i = +bt.id[1], cost = gm.skillCost(i); frac = p.cds[i] / gm.skillCd(i); ready = p.cds[i] <= 0 && p.mp >= cost; cdText = p.cds[i] > 0 ? Math.ceil(p.cds[i]) + '' : (p.mp < cost ? '缺魔' : ''); }
        else if (bt.id === 'dodge') { frac = p.defCd / c.defCD; ready = p.defCd <= 0; }
        const held = TOUCH.held[bt.id];
        g.fillStyle(0x14110d, this.touch ? (held ? 0.4 : 0.11) : (held ? 0.9 : 0.6)); g.fillCircle(bt.x, bt.y, bt.r);
        if (bt.id === 'jump' && this.touch) { // footprint icon
          const a = held ? 0.9 : 0.6, fx = bt.x - 2, fy = bt.y + 4, k = bt.r / 36;
          g.fillStyle(0xf2e6c4, a); g.fillEllipse(fx, fy + 4 * k, 16 * k, 26 * k); g.fillEllipse(fx + 1 * k, fy - 9 * k, 13 * k, 12 * k);
          [[-6, -20, 4.2], [-1, -23, 3.6], [4, -22, 3.3], [8, -19, 2.9], [11, -15, 2.5]].forEach(([dx, dy, rr]) => g.fillCircle(fx + dx * k, fy + dy * k, rr * k));
        }
        if (bt.img) {
          const i = +bt.id[1], st = skillStage(gm.skillLv(i));
          if (st !== bt.stage) { const k2 = `sk_${gm.clsKey}_${i}_${st}`; if (this.textures.exists(k2)) bt.img.setTexture(k2).setDisplaySize(bt.r * 2.1, bt.r * 2.1); bt.stage = st; }
          bt.img.setAlpha(this.touch ? (ready ? (held ? 0.9 : 0.57) : 0.3) : (ready ? (held ? 0.8 : 1) : 0.55));
          g2.lineStyle(3, ready ? [0xc9a45c, 0xd8e0ff, 0xffd76a][st] : 0x5a5040, ready ? 1 : 0.6); g2.strokeCircle(bt.x, bt.y, bt.r);
        } else { g.lineStyle(this.touch ? 3 : 2, ready ? 0xc9a45c : 0x5a5040, ready ? (this.touch ? 0.6 : 0.9) : (this.touch ? 0.3 : 0.5)); g.strokeCircle(bt.x, bt.y, bt.r); }
      }
      if (frac > 0) { const gg2 = bt.img ? g2 : g; gg2.fillStyle(0x000000, this.touch ? 0.3 : 0.6); gg2.slice(bt.x, bt.y, bt.r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac, false); gg2.fillPath(); }
      bt.t.setAlpha(ready ? 1 : 0.5); bt.cd.setText(cdText);
      if (bt.potion) bt.k.setText(count);
    }
    if (this.touch) {
      if (this.joy) { g.fillStyle(0xffffff, 0.08); g.fillCircle(this.joy.ox, this.joy.oy, 60); g.lineStyle(2, 0xc9a45c, 0.4); g.strokeCircle(this.joy.ox, this.joy.oy, 60); g.fillStyle(0xc9a45c, 0.5); g.fillCircle(this.joy.x, this.joy.y, 26); }
      else { g.lineStyle(2, 0xc9a45c, 0.18); g.strokeCircle(130, 430, 60); g.fillStyle(0xc9a45c, 0.15); g.fillCircle(130, 430, 26); }
    }
  }
}

/* ================= boot ================= */
function boot() {
  window.__game = new Phaser.Game({
    type: Phaser.AUTO, parent: 'game', width: W, height: H, backgroundColor: '#0b0d0a',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    input: { activePointers: 4 }, scene: [Select, Town, Game, UI]
  });
}
// unlock audio on the very first user gesture anywhere on the page (browsers block sound until then)
['pointerdown', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, () => SFX.resume(), { passive: true }));
/* accidental-exit guard: the phone's back gesture / back button asks first instead of leaving, refresh and closing the tab
   warn while you are in town or a stage, and long-press menus are disabled */
const ExitGuard = {
  leaving: false,
  inPlay() { return !!((G.game && G.game.sys && G.game.sys.isActive()) || (G.town && G.town.sys && G.town.sys.isActive())); },
  init() {
    try { history.pushState({ guard: 1 }, ''); } catch (e) {}
    window.addEventListener('popstate', () => {
      if (this.leaving) return;
      try { history.pushState({ guard: 1 }, ''); } catch (e) {}
      if (Panel.open) { Panel.close(); return; } // back = close the open window first
      this.ask();
    });
    window.addEventListener('beforeunload', e => { if (!this.leaving && this.inPlay()) { e.preventDefault(); e.returnValue = ''; } });
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('gesturestart', e => e.preventDefault()); // iOS pinch zoom
  },
  ask() {
    const gm = G.game && G.game.sys && G.game.sys.isActive() ? G.game : null, wasPaused = gm && gm.paused;
    if (gm) gm.paused = true;
    Panel.show('要離開遊戲嗎？', body => {
      body.append(h('div', { class: 'say' }, gm ? '關卡進行中離開，這一關的進度不會保留（已撿到的金幣和裝備會留著）。' : '你的角色和裝備都已經存檔了。'));
      body.append(h('div', { style: 'display:flex;gap:10px;justify-content:center;margin-top:10px' },
        h('button', { type: 'button', class: 'primary', on: { click: () => Panel.close() } }, '繼續玩'),
        h('button', { type: 'button', on: { click: () => { this.leaving = true; Save.write(); history.go(-2); } } }, '離開遊戲')));
    }, () => { if (gm && !wasPaused) gm.paused = false; });
  }
};
ExitGuard.init();
// if the screen shape changes a lot after loading (rotated, or an app viewer resized the page), re-fit the game width:
// safe outside a stage (the select screen and town are always saved), so reload there; mid-stage keep playing as is
let refitT = null;
window.addEventListener('resize', () => {
  clearTimeout(refitT);
  refitT = setTimeout(() => {
    if (!window.__game || Math.abs(fitW() - W) < 40 || (IS_TOUCH && window.innerWidth < window.innerHeight)) return;
    if (G.game && G.game.sys && G.game.sys.isActive()) return;
    ExitGuard.leaving = true; Save.write(); location.reload();
  }, 700);
});
const fontReady = (document.fonts && document.fonts.load) ? Promise.race([document.fonts.load('900 20px "Noto Serif TC"', '全員瘋子RPG'), new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
// on a phone held upright, wait until it is turned sideways so the game is sized for the landscape screen
const bootWhenLandscape = () => {
  if (!IS_TOUCH || window.innerWidth > window.innerHeight) { W = fitW(); boot(); return; }
  const on = () => { if (window.innerWidth > window.innerHeight) { window.removeEventListener('resize', on); setTimeout(() => { W = fitW(); boot(); }, 250); } };
  window.addEventListener('resize', on);
};
fontReady.then(bootWhenLandscape, bootWhenLandscape);
</script>
